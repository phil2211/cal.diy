name: Cursor Autofix

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  trigger-cursor:
    if: github.event.label.name == 'autofix'
    runs-on: ubuntu-latest
    steps:
      - name: Issue an Cursor übergeben
        env:
          URL: ${{ secrets.CURSOR_AUTOMATION_URL }}
          KEY: ${{ secrets.CURSOR_WEBHOOK_KEY }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          payload=$(jq -n \
            --arg repo "$REPO" --arg number "$NUMBER" --arg title "$TITLE" \
            --arg body "$BODY" --arg url "$ISSUE_URL" --argjson labels "$LABELS" \
            '{context: ("Repository: \($repo)\nIssue #\($number): \($title)\n\($url)\n\n\($body)"),
              repository: $repo, issue_number: ($number|tonumber), labels: $labels}')
          curl --fail-with-body -sS -X POST "$URL" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Kommentar im Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "🤖 An Cursor übergeben, ein Agent arbeitet daran."
